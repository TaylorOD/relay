name: Deploy relay
on:
  workflow_run:
    workflows: [Check relay]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish
        uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
          commit-message: publish relay
