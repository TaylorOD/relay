name: Deploy PR previews
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: write
  pull-requests: write
  deployments: read
  pages: read
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          VITE_BASE_PATH: /relay/pr-preview/pr-${{ github.event.number }}/
      - name: Publish or remove preview
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: www.taylordorsett.com/relay
          wait-for-pages-deployment: true
          deploy-commit-message: publish preview
          remove-commit-message: remove preview
